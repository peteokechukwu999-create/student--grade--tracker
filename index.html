<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Tracker</title>

    <!-- CSS LINK -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Grade Tracker</h1>

        <!-- FORM -->
        <div class="form-section">

            <input type="text" id="studentName" placeholder="Enter Student Name">

            <input type="number" id="studentGrade" placeholder="Enter Grade">

            <button id="addBtn">Add Student</button>
            <button id="clearBtn" class="secondary">Clear All</button>

        </div>

        <p id="errorMessage" class="error-message"></p>

        <!-- AVERAGE -->
        <h2 id="averageGrade">Average Grade: 0</h2>

        <!-- TABLE -->
        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Grade</th>
                    <th>Letter</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentList">

            </tbody>

        </table>

    </div>

    <!-- JAVASCRIPT LINK -->
    <script src="script.js"></script>

</body>
</html>
